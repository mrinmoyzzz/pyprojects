<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #00c6ff, #0072ff);
        }

        .container {
            text-align: center;
        }

        .weather-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: none;
        }

        #city-input {
            padding: 10px;
            margin: 10px 0;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #city-input-btn {
            padding: 10px;
            background-color: #0072ff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #weather-icon {
            width: 80px;
            height: 80px;
        }

        #temperature {
            font-size: 24px;
            font-weight: bold;
        }

        #description {
            font-size: 18px;
        }

        #wind-speed, #air-quality {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="city-input" placeholder="Enter city name (e.g., Berlin)" />
        <button id="city-input-btn">Get Weather</button>
        <div id="weather-info" class="weather-card">
            <h2 id="city-name"></h2>
            <img id="weather-icon" src="" alt="Weather Icon" />
            <p id="temperature"></p>
            <p id="description"></p>
            <p id="wind-speed"></p>
            <p id="air-quality"></p>
        </div>
    </div>
    <script>
        document.getElementById('city-input-btn').addEventListener('click', async function () {
            const city = document.getElementById('city-input').value;
            if (!city) {
                alert('Please enter a city name.');
                return;
            }

            try {
                // Get coordinates from OpenStreetMap (Nominatim)
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${city}`);
                const geoData = await geoRes.json();
                if (geoData.length === 0) throw new Error('City not found.');

                const lat = geoData[0].lat;
                const lon = geoData[0].lon;

                // Call Open-Meteo API
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weather_code,wind_speed_10m&current_weather=true`);
                const weatherData = await weatherRes.json();

                const current = weatherData.current_weather;

                document.getElementById('city-name').innerText = city;
                document.getElementById('temperature').innerText = `${current.temperature} °C`;
                document.getElementById('description').innerText = `Weather Code: ${current.weathercode}`;
                document.getElementById('wind-speed').innerText = `Wind Speed: ${current.windspeed} km/h`;
                document.getElementById('air-quality').innerText = "Air Quality: (Not available from Open-Meteo)";
                document.getElementById('weather-icon').src = 'https://cdn-icons-png.flaticon.com/512/1163/1163661.png'; // Placeholder icon
                document.getElementById('weather-info').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert('Error fetching weather data.');
            }
        });
    </script>
    <marquee>this a site by mrinmoy using simple api tools </marquee>
</body>
</html>
